[package]
name = "commanductui"
version = "2.0.0"
edition = "2024"
license = "MIT"
description = "Declarative, command-driven Win32 UI toolkit powering SourcePacker."
repository = "https://github.com/larspensjo/CommanDuctUI"
homepage = "https://github.com/larspensjo/CommanDuctUI"
documentation = "https://docs.rs/commanductui"
readme = "Readme.md"
keywords = ["win32", "windows", "gui", "ui", "declarative"]
categories = ["gui", "os::windows-apis"]
rust-version = "1.85"
include = [
    "src/**",
    "examples/**",
    "Cargo.toml",
    "LICENSE",
    "Readme.md",
    "CHANGELOG.md",
]

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[dependencies]
log = "0.4.28"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_WindowsProgramming",
    "Win32_Storage_FileSystem",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls_RichEdit",
    "Win32_Graphics_Dwm",
] }
